name: CI

# Pull requests test GitHub's merge ref, so a push to main does not run CI
# again. Run the workflow by hand to test main.
on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # npm ci runs the prepare script, which builds dist.
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
